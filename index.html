<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>文件读取测试</title></head>
<body>
  <h2>文件读取测试</h2>
  <label for="fileTest" style="display:inline-block;background:#2D5F8A;color:#fff;padding:10px 30px;cursor:pointer;border-radius:6px;">选择文件</label>
  <input type="file" id="fileTest" accept=".csv,text/csv" style="display:none;">
  <div id="log"></div>
  <script>
    document.getElementById('fileTest').addEventListener('change', function(e){
      var file = this.files[0];
      if (!file) return;
      document.getElementById('log').innerHTML = '选择了文件：' + file.name;
      console.log('change 触发', file);
      var reader = new FileReader();
      reader.onload = function(ev){
        var text = ev.target.result;
        document.getElementById('log').innerHTML += '<br>文件内容长度：' + text.length;
        console.log('文件内容前100字符：', text.slice(0,100));
      };
      reader.readAsText(file, 'UTF-8');
    });
    // 点击标签触发文件选择
    document.querySelector('label[for="fileTest"]').addEventListener('click', function(){
      document.getElementById('fileTest').click();
    });
  </script>
</body>
</html>
